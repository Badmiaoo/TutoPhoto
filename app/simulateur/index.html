<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Adresse sans barre finale (…/simulateur) : les chemins relatifs du site viseraient le dossier parent, et
      // la page resterait sans code ni scène. On ajoute la barre avant tout chargement (version 0.3.51).
      if (!location.pathname.endsWith("/")) location.replace(location.pathname + "/" + location.search + location.hash);
    </script>
    <title>Simulateur · TutoPhoto</title>
  </head>
  <body>
    <header id="header" class="bar">
      <h1>TutoPhoto</h1>
      <p id="subtitle" class="subtitle"></p>
      <nav class="links">
        <a id="home" href="../"></a>
        <button id="challenge-button" type="button"></button>
        <button id="credits" type="button"></button>
        <a id="licences" href="../licences/"></a>
      </nav>
    </header>
    <main>
      <canvas id="scene"></canvas>
      <div id="frame" class="frame" aria-hidden="true">
        <!-- Grille de cadrage (CMP-02, version 0.3.56) : lignes tracées par ui/cameraPanel.ts. -->
        <div id="frame-grid" class="frame-grid" hidden></div>
      </div>
      <div id="af-coverage" class="af-coverage" aria-hidden="true"></div>
      <div id="focus-marker" class="focus-marker" aria-hidden="true"></div>
      <p id="preview-badge" class="preview-badge" hidden></p>
      <!-- Loupe, puis mode et distance de mise au point, empilés en bas à gauche du viseur (constat INT-11 de l'audit,
           version 0.4.10). -->
      <div class="viewfinder-info">
        <p id="loupe-badge" class="preview-badge loupe-badge" hidden></p>
        <p id="af-badge" class="preview-badge af-badge" hidden></p>
      </div>
      <div id="top-view" class="top-view">
        <button id="top-view-toggle" type="button" class="top-view-toggle" aria-expanded="true"></button>
        <svg id="top-view-map" class="top-view-map" role="img"></svg>
        <p id="top-view-note" class="top-view-note"></p>
        <button id="top-view-reset" type="button" class="top-view-toggle"></button>
      </div>
      <div id="balance" class="balance">
        <button id="balance-toggle" type="button" class="balance-toggle" aria-expanded="true">
          <svg class="balance-triangle" viewBox="0 0 120 106" aria-hidden="true">
            <polygon class="balance-shape" points="60,10 10,96 110,96" />
            <circle id="balance-aperture" class="balance-vertex neutral" cx="60" cy="10" r="7" />
            <circle id="balance-shutter" class="balance-vertex neutral" cx="10" cy="96" r="7" />
            <circle id="balance-iso" class="balance-vertex neutral" cx="110" cy="96" r="7" />
            <circle id="balance-point" class="balance-point ok" cx="60" cy="67" r="8" />
          </svg>
        </button>
        <div class="balance-text">
          <p id="balance-title" class="balance-title"></p>
          <ul class="balance-lines">
            <li id="balance-dof"></li>
            <li id="balance-motion"></li>
            <li id="balance-noise"></li>
          </ul>
          <details class="balance-details">
            <summary id="balance-limits"></summary>
            <p id="balance-note" class="balance-note"></p>
          </details>
        </div>
      </div>
      <div id="progress" class="progress" hidden>
        <p id="progress-label"></p>
        <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
      </div>
      <section id="review" class="review" hidden>
        <img id="review-image" alt="" />
        <!-- Affichages de l'écran de revue (MES-06, MES-07 ; version 0.3.57 ; ui/reviewInfo.ts). L'image reste le
             premier élément, sans conteneur : les zones écrêtées sont un calque placé sur elle, qui ne prend pas les
             touchers (toucher la photo ouvre la loupe). -->
        <canvas id="review-highlights" class="review-highlights" aria-hidden="true" hidden></canvas>
        <div id="review-info-row" class="review-actions" hidden>
          <button id="review-info" type="button"></button>
        </div>
        <div id="review-histograms" class="review-histograms" hidden></div>
        <p id="review-clipping" class="review-caption" role="status" hidden></p>
        <details id="review-info-details" class="review-info-details" hidden>
          <summary id="review-info-limits"></summary>
          <p id="review-info-note" class="note"></p>
        </details>
        <p id="review-caption" class="review-caption"></p>
        <ul id="review-bulletin" class="review-bulletin" hidden></ul>
        <p id="review-hint" class="review-caption"></p>
        <div id="review-series" class="review-actions" hidden>
          <button id="review-prev" type="button"></button>
          <span id="review-count"></span>
          <button id="review-next" type="button"></button>
        </div>
        <div class="review-actions">
          <button id="review-whole" type="button" hidden></button>
          <button id="review-back" type="button"></button>
          <a id="review-save" download="tutophoto.jpg"></a>
        </div>
      </section>
      <!-- Message de la scène (main.ts, renderStatus) : la zone vivante ne porte que le message ; le compteur du
           chargement, réécrit chaque seconde, et le bouton « Recharger » sont à côté d'elle (constat INT-15 de l'audit,
           version 0.4.7). -->
      <p id="status" class="status"><span id="status-message" role="status"></span><span id="status-detail"></span></p>
      <p id="diagnostic" class="diagnostic" role="alert" hidden></p>
      <p id="no-webgl" class="error" hidden></p>
    </main>
    <section id="camera-panel" class="panel">
      <div class="dials">
        <div class="dial" data-box="aperture">
          <span class="dial-name" id="dial-aperture-name"></span>
          <div class="dial-row">
            <button type="button" data-dial="aperture" data-step="-1">−</button>
            <output aria-live="polite" aria-labelledby="dial-aperture-name"></output>
            <button type="button" data-dial="aperture" data-step="1">+</button>
          </div>
        </div>
        <div class="dial" data-box="shutter">
          <span class="dial-name" id="dial-shutter-name"></span>
          <div class="dial-row">
            <button type="button" data-dial="shutter" data-step="-1">−</button>
            <output aria-live="polite" aria-labelledby="dial-shutter-name"></output>
            <button type="button" data-dial="shutter" data-step="1">+</button>
          </div>
        </div>
        <div class="dial" data-box="iso">
          <span class="dial-name" id="dial-iso-name"></span>
          <div class="dial-row">
            <button type="button" data-dial="iso" data-step="-1">−</button>
            <output aria-live="polite" aria-labelledby="dial-iso-name"></output>
            <button type="button" data-dial="iso" data-step="1">+</button>
          </div>
        </div>
        <div class="dial" data-box="focal">
          <span class="dial-name" id="dial-focal-name"></span>
          <div class="dial-row">
            <button type="button" data-dial="focal" data-step="-1">−</button>
            <output aria-live="polite" aria-labelledby="dial-focal-name"></output>
            <button type="button" data-dial="focal" data-step="1">+</button>
          </div>
        </div>
      </div>
      <div class="meter-row">
        <div class="meter" aria-hidden="true">
          <span class="meter-tick" style="left: 0%">−3</span>
          <span class="meter-tick" style="left: 33.333%">−1</span>
          <span class="meter-tick meter-zero" style="left: 50%">0</span>
          <span class="meter-tick" style="left: 66.667%">+1</span>
          <span class="meter-tick" style="left: 100%">+3</span>
          <span id="meter-needle" class="meter-needle"></span>
        </div>
        <button id="meter-value" type="button" class="body-button meter-value"></button>
        <button id="body-button" type="button" class="body-button"></button>
        <button id="preview-button" type="button" class="body-button"></button>
        <button id="af-button" type="button" class="body-button"></button>
        <button id="release-button" type="button" class="body-button"></button>
        <button id="loupe-button" type="button" class="body-button" aria-pressed="false"></button>
        <button id="shutter-button" type="button" class="shutter-button"></button>
      </div>
      <!-- Les deux phrases de la consigne, l'une sur l'autre ; celle du mode qui n'est pas choisi est invisible, et la
           consigne garde la hauteur de la plus longue (constat INT-04 de l'audit, version 0.4.10). -->
      <p id="focus-hint" class="note focus-hint"><span id="focus-hint-single"></span><span id="focus-hint-continuous"></span></p>
    </section>
    <dialog id="body-dialog" aria-labelledby="body-title">
      <h2 id="body-title"></h2>
      <fieldset>
        <legend id="brand-legend"></legend>
        <label><input type="radio" name="brand" value="nikon" /> <span id="brand-nikon-label"></span></label>
        <label><input type="radio" name="brand" value="sony" /> <span id="brand-sony-label"></span></label>
        <label><input type="radio" name="brand" value="canon" /> <span id="brand-canon-label"></span></label>
      </fieldset>
      <p id="body-note" class="note"></p>
      <p id="sensor-note" class="note"></p>
      <p id="lens-note" class="note"></p>
      <form method="dialog">
        <button id="body-close" type="submit"></button>
      </form>
    </dialog>
    <dialog id="preview-dialog" aria-labelledby="preview-title">
      <h2 id="preview-title"></h2>
      <label class="toggle"><input type="checkbox" value="all" /> <span id="preview-all-label"></span></label>
      <div class="toggle-group">
        <label class="toggle"><input type="checkbox" value="brightness" /> <span id="preview-brightness-label"></span></label>
        <label class="toggle"><input type="checkbox" value="noise" /> <span id="preview-noise-label"></span></label>
        <label class="toggle"><input type="checkbox" value="depthOfField" /> <span id="preview-dof-label"></span></label>
        <label class="toggle"><input type="checkbox" value="balance" /> <span id="preview-balance-label"></span></label>
      </div>
      <p id="preview-note" class="note"></p>
      <fieldset>
        <legend id="preview-grid-legend"></legend>
        <label><input type="radio" name="grid" value="none" /> <span id="preview-grid-none-label"></span></label>
        <label><input type="radio" name="grid" value="thirds" /> <span id="preview-grid-thirds-label"></span></label>
        <label><input type="radio" name="grid" value="sixteen" /> <span id="preview-grid-sixteen-label"></span></label>
        <label><input type="radio" name="grid" value="twentyFour" /> <span id="preview-grid-twentyfour-label"></span></label>
        <label><input type="radio" name="grid" value="thirdsDiagonals" /> <span id="preview-grid-diagonals-label"></span></label>
      </fieldset>
      <p id="preview-grid-note" class="note"></p>
      <form method="dialog">
        <button id="preview-close" type="submit"></button>
      </form>
    </dialog>
    <dialog id="af-dialog" aria-labelledby="af-title">
      <h2 id="af-title"></h2>
      <fieldset>
        <legend id="af-mode-legend"></legend>
        <label><input type="radio" name="focusMode" value="single" /> <span id="af-single-label"></span></label>
        <label><input type="radio" name="focusMode" value="continuous" /> <span id="af-continuous-label"></span></label>
      </fieldset>
      <fieldset>
        <legend id="af-area-legend"></legend>
        <label><input type="radio" name="areaMode" value="point" /> <span id="af-point-label"></span></label>
        <label><input type="radio" name="areaMode" value="wideS" /> <span id="af-wide-s-label"></span></label>
        <label><input type="radio" name="areaMode" value="wideL" /> <span id="af-wide-l-label"></span></label>
        <label><input type="radio" name="areaMode" value="auto" /> <span id="af-auto-label"></span></label>
      </fieldset>
      <fieldset>
        <legend id="af-detection-legend"></legend>
        <label><input type="radio" name="detection" value="faceEye" /> <span id="af-det-face-eye-label"></span></label>
        <label><input type="radio" name="detection" value="face" /> <span id="af-det-face-label"></span></label>
        <label><input type="radio" name="detection" value="animal" /> <span id="af-det-animal-label"></span></label>
        <label><input type="radio" name="detection" value="off" /> <span id="af-det-off-label"></span></label>
      </fieldset>
      <p id="af-note" class="note"></p>
      <p id="af-loupe-note" class="note"></p>
      <form method="dialog">
        <button id="af-close" type="submit"></button>
      </form>
    </dialog>
    <dialog id="challenge-dialog" aria-labelledby="challenge-title">
      <h2 id="challenge-title"></h2>
      <!-- Groupe nommé par le titre de la fenêtre, comme celui de la fenêtre « Mode de déclenchement » (constat INT-19 de
           l'audit, point 6, version 0.4.7 ; [wcag-22-info-and-relationships]). -->
      <fieldset aria-labelledby="challenge-title">
        <label><input type="radio" name="challenge" value="none" /> <span id="challenge-none-label"></span></label>
        <div class="challenge-line"><label><input type="radio" name="challenge" value="SIT-01" /> <span id="challenge-SIT-01-label"></span></label> <button type="button" class="fiche-open" data-fiche="SIT-01"></button></div>
        <div class="challenge-line"><label><input type="radio" name="challenge" value="SIT-05" /> <span id="challenge-SIT-05-label"></span></label> <button type="button" class="fiche-open" data-fiche="SIT-05"></button></div>
        <div class="challenge-line"><label><input type="radio" name="challenge" value="SIT-06" /> <span id="challenge-SIT-06-label"></span></label> <button type="button" class="fiche-open" data-fiche="SIT-06"></button></div>
      </fieldset>
      <p id="challenge-note" class="note"></p>
      <form method="dialog">
        <button id="challenge-close" type="submit"></button>
      </form>
    </dialog>
    <dialog id="exposure-dialog" aria-labelledby="exposure-title">
      <h2 id="exposure-title"></h2>
      <!-- Ce que dit l'indicateur, et pourquoi une valeur clignote : écrits ici et non dans une seule infobulle (constat
           INT-09 de l'audit, version 0.4.7). La phrase du clignotement n'est affichée que pendant qu'il dure ; la zone
           vivante qui la contient reste dans la page. -->
      <p id="exposure-meter-help" class="note"></p>
      <div role="status"><p id="exposure-limit" class="note" hidden></p></div>
      <fieldset>
        <legend id="exposure-mode-legend"></legend>
        <label><input type="radio" name="exposureMode" value="M" /> <span id="exposure-m-label"></span></label>
        <label><input type="radio" name="exposureMode" value="A" /> <span id="exposure-a-label"></span></label>
        <label><input type="radio" name="exposureMode" value="S" /> <span id="exposure-s-label"></span></label>
      </fieldset>
      <p class="release-select"><label><span id="exposure-comp-label"></span> <select name="compensation"></select></label></p>
      <fieldset>
        <legend id="exposure-auto-legend"></legend>
        <label><input type="checkbox" name="autoIso" /> <span id="exposure-auto-label"></span></label>
        <p class="release-select"><label><span id="exposure-max-label"></span> <select name="maxIso"></select></label></p>
        <p class="release-select"><label><span id="exposure-min-label"></span> <select name="minShutter"></select></label></p>
      </fieldset>
      <p id="exposure-note" class="note"></p>
      <form method="dialog">
        <button id="exposure-close" type="submit"></button>
      </form>
    </dialog>
    <dialog id="release-dialog" aria-labelledby="release-title">
      <h2 id="release-title"></h2>
      <fieldset aria-labelledby="release-title">
        <label><input type="radio" name="release" value="single" /> <span id="release-single-label"></span></label>
        <label><input type="radio" name="release" value="cl" /> <span id="release-cl-label"></span></label>
        <label><input type="radio" name="release" value="ch" /> <span id="release-ch-label"></span></label>
        <label><input type="radio" name="release" value="chx" /> <span id="release-chx-label"></span></label>
        <label><input type="radio" name="release" value="timer" /> <span id="release-timer-label"></span></label>
      </fieldset>
      <p class="release-select"><label><span id="release-cl-rate-label"></span> <select name="clRate"></select></label></p>
      <p class="release-select"><label><span id="release-delay-label"></span> <select name="timerDelay"></select></label></p>
      <p id="release-note" class="note"></p>
      <form method="dialog">
        <button id="release-close" type="submit"></button>
      </form>
    </dialog>
    <dialog id="fiche-dialog" class="fiche-dialog" aria-labelledby="fiche-title">
      <div id="fiche-body" class="fiche-body"></div>
      <p class="fiche-actions"><a id="fiche-page" target="_blank" rel="noopener"></a></p>
      <form method="dialog">
        <button id="fiche-close" type="submit"></button>
      </form>
    </dialog>
    <dialog id="credits-dialog" aria-labelledby="credits-title">
      <h2 id="credits-title"></h2>
      <p id="credits-intro"></p>
      <!-- Version du site, écrite par credits.ts : le numéro du premier titre de version de CHANGELOG.md. Au-dessus
           de la liste des crédits, pour se lire dès l'ouverture de la fenêtre, sans la faire défiler. -->
      <p id="credits-version" class="note"></p>
      <ul id="credits-list"></ul>
      <form method="dialog">
        <button id="credits-close" type="submit"></button>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
