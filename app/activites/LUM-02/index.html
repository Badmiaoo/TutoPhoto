<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Adresse sans barre finale (…/simulateur) : les chemins relatifs du site viseraient le dossier parent, et
      // la page resterait sans code ni scène. On ajoute la barre avant tout chargement (version 0.3.51).
      if (!location.pathname.endsWith("/")) location.replace(location.pathname + "/" + location.search + location.hash);
    </script>
    <title>LUM-02 · TutoPhoto</title>
  </head>
  <body>
    <header class="act-bar">
      <a id="act-home" class="act-brand" href="../../">TutoPhoto</a>
      <nav>
        <a id="act-fiche" href="../../fiches/fr/LUM-02.html"></a>
        <button id="act-lang" type="button"></button>
      </nav>
    </header>
    <main class="act-main">
      <h1 id="act-title"></h1>
      <p id="act-intro"></p>
      <svg id="act-scene" class="act-scene" role="img"></svg>
      <p id="act-legend" class="act-note"></p>
      <div class="act-controls">
        <label><span id="act-size-label"></span> <output id="act-size-value"></output>
          <input id="act-size" type="range" min="1" max="150" step="1" value="3" /></label>
        <label><span id="act-distance-label"></span> <output id="act-distance-value"></output>
          <input id="act-distance" type="range" min="20" max="400" step="5" value="100" /></label>
      </div>
      <p class="act-presets"><span id="act-presets-label"></span>
        <button type="button" data-preset="lamp"></button>
        <button type="button" data-preset="window"></button>
        <button type="button" data-preset="reflector"></button>
      </p>
      <ul class="act-readout">
        <li id="act-angle"></li>
        <li id="act-penumbra"></li>
        <li id="act-umbra"></li>
      </ul>
      <p id="act-calc" class="act-note"></p>
      <section class="act-quiz" id="act-quiz"></section>
      <p id="act-sources" class="act-note"></p>
    </main>
    <script type="module" src="/src/activities/lum02.ts"></script>
  </body>
</html>
