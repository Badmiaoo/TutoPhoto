    label: "Tiffen (Lowel), Foundations of Lighting: Understanding Soft Light, source secondaire : « A soft light source would be one that appears larger in relative size than the subject being lit » ; le soleil, très loin, « appears smaller » et donne une lumière plus dure ; par ciel couvert, « the entire white cloudy sky is now the light source » ; reculer la source la rend plus petite et plus dure ; un réflecteur devient la source (lu le 11 novembre 2026) ; « bouncing the output of a light […] off a white ceiling or wall to bring up the ambient light level in a room is well known » (relu le 20 novembre 2026) ; ce qu'en tire aussi la fiche LUM-02 : « Being larger than the subject, the light source is covering it from a greater angle and, as a result, filling in more of the potential shadow areas » ; « Moving the soft light back created a smaller source » ; « Using diffusion gel in a frame attached to the front of a hard light can soften it » ; le tout relu le 22 novembre 2026"
