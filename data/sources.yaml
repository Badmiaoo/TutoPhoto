  - id: wikipedia-rule-of-thirds
    group: "Cours et pédagogie"
    label: "Wikipedia, Rule of thirds (révision 1383322855 du 2 novembre 2026, source secondaire) : image divisée en neuf parties égales par deux lignes horizontales et deux lignes verticales, éléments importants sur ces lignes ou à leurs croisements ; « to discourage placement of the subject at the center » ; expression écrite pour la première fois par John Thomas Smith en 1797 ; réserves de George Field (1845) et étude d'Amirshahi et collègues (2014) (lue le 12 novembre 2026) ; ce qu'en tire aussi la fiche CMP-02 : « rule of thumb » ; « more tension, energy and interest » qu'un sujet centré ; l'horizon qui ne doit pas paraître couper l'image en deux ; le corps sur une ligne verticale et les yeux sur une ligne horizontale ; l'espace laissé devant un sujet immobile qui ne fait pas face à l'appareil ; les proportions de deux tiers pour un tiers que propose Smith, dont le propos, d'après l'article, est indépendant de l'usage du terme en composition et en photographie ; le tout relu le 22 novembre 2026"
    url: "https://en.wikipedia.org/w/index.php?title=Rule_of_thirds&oldid=1383322855"
