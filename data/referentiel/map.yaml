# fichier: data/referentiel/map.yaml
domain:
  id: MAP
  title: {fr: "Mise au point et autofocus", en: "focus and autofocus"}
  intro: "21 notions : la scène 3D connaît la distance de chaque objet et la place des visages et des yeux, ce qui permet de placer le plan net et de simuler chaque mode AF et chaque collimateur, options comprises. Un premier plan flou qui déborde sur le sujet (grillage, branche) laisse voir une partie de ce qu'il cache : la qualité de ce rendu dépend de la méthode de rendu de la profondeur de champ."
  sources: [sheng-2023]
  todo:
    - "Vérifier, au choix du moteur de rendu, que le flou d'un premier plan qui déborde sur le sujet est rendu correctement."
notions:
