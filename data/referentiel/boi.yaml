      simulator: "Couples équivalents affichés pendant le décalage"
      exercise: "En P, obtenir un fond flou"
    situations: [SIT-01]
    since: v0.1
  - id: BOI-07
    title: {fr: "Priorité à l'ouverture", en: "aperture priority, A/Av"}
