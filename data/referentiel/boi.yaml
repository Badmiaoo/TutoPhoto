      simulator: "Alerte de vitesse trop lente"
      exercise: "Portrait fond flou sans bougé"
    situations: [SIT-01, SIT-11]
    sources: [nikon-z6-mode-dial, nikon-z6-mode-dial-fr, nikon-z6-indicators]
    since: v0.1
