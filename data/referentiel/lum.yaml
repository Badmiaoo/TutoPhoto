# fichier: data/referentiel/lum.yaml
domain:
  id: LUM
  title: "Lumière et flash"
  intro: "Dix-huit notions : lumière naturelle, sources qu'on place soi-même, réflecteurs et flash (direct, rebondi, déporté), simulés dans la scène 3D."
  todo:
    - "Vérifier, dans la maquette 3D, le rendu du flash direct, rebondi et déporté."
notions:
  - id: LUM-01
    title: "Lire la lumière"
    level: N1
    spec:
      explanation: "D'où vient la lumière, sa qualité, ses ombres, avant tout réglage"
      simulator: "Mode lumière qui révèle sources et ombres"
      exercise: "Décrire la lumière de cinq scènes"
    situations: all
    since: v0.1
  - id: LUM-02
    title: "Lumière dure ou douce"
    level: N1
    activity: true
    spec:
      explanation: "La douceur dépend de la taille apparente de la source"
      simulator: "Activité interactive en V1 ; en V2, simulateur : taille de la source réglable, du soleil direct au ciel couvert"
      exercise: "Choisir le lieu ou l'heure d'un portrait doux"
    situations: [SIT-01, SIT-02, SIT-V2-01]
    notes:
      - "Simulateur reporté en V2 (décision de Julien du 10 novembre 2026) : le fond de la scène de parc est une photo à 360° prise par ciel couvert, qu'un soleil direct contredirait. En V1, une activité interactive le remplace."
    sources: [tiffen-lowel-soft-light, pvc-adams-soft-light]
    since: v0.1
  - id: LUM-03
    title: "Direction de la lumière"
    level: N1
