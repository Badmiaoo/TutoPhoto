name: Routine de test du site

# La routine scripts/test_app.cjs (ordinateur, Android, iPhone, WebGL 1 ; CLAUDE.md) sur chaque pull request qui
# touche le site construit : un job par profil, en parallèle. Sur la machine de Claude, les quatre profils à la
# suite occupaient tous les cœurs pendant 53 minutes (mesuré le 11 novembre 2026, version 0.3.53).
on:
  pull_request:
    paths:
      - "app/**"
      - "content/**"
      - "data/**"
      - "scripts/test_app.cjs"
      - ".github/workflows/routine.yml"
  workflow_dispatch: # relance à la main

permissions:
  contents: read

# Un nouveau commit sur la même pull request remplace la routine en cours.
concurrency:
  group: routine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routine:
    name: routine (${{ matrix.profil }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false # un profil en échec n'arrête pas les autres
      matrix:
        profil: [ordinateur, android, iphone, webgl1]
    defaults:
      run:
        shell: bash
    steps:
      # Actions épinglées par commit ; licence MIT vérifiée le 7 novembre 2026.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Construire le site
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Installer Playwright et son Chromium, hors du dépôt
        env:
          # Même version que sur la machine de Claude (docs/pile-technique.md) ; licence Apache-2.0.
          PLAYWRIGHT_VERSION: "1.63.0"
        run: |
          npm install --prefix "$RUNNER_TEMP/outils" --no-save "playwright@${PLAYWRIGHT_VERSION}"
          "$RUNNER_TEMP/outils/node_modules/.bin/playwright" install --with-deps chromium
      - name: Routine de test
        env:
          NODE_PATH: ${{ runner.temp }}/outils/node_modules
          PROFIL: ${{ matrix.profil }}
        run: node scripts/test_app.cjs --photo --profils "$PROFIL" 2>&1 | tee "$RUNNER_TEMP/routine.txt"
      - name: Résultats dans le résumé du job
        if: always()
        run: |
          {
            echo '```'
            cat "$RUNNER_TEMP/routine.txt" 2>/dev/null || echo "La routine n'a rien écrit."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
