name: Validation du référentiel

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        # bash explicite : active pipefail, pour que l'échec de coverage.py ne soit pas masqué par tee.
        shell: bash
    steps:
      # Actions épinglées par commit ; licence MIT vérifiée le 7 novembre 2026.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Contrôler le référentiel
        run: python scripts/validate.py
      - name: Comptes et couverture
        run: python scripts/coverage.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Contrôler le changelog
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Sur une pull request : elle doit ajouter une version plus récente que celle de la branche cible.
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            python scripts/changelog.py check --base FETCH_HEAD
          else
            python scripts/changelog.py check
          fi

  confidentialite:
    # Dépôt public : rien de privé ne doit y entrer (docs/publication.md).
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tout l'historique : adresses des commits et recherche de secrets
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Fichiers et commits sans information privée
        run: python scripts/check_public.py --commits all
      - name: Secrets dans tout l'historique (gitleaks)
        env:
          GITLEAKS_VERSION: "8.30.1"
          # Empreinte publiée dans gitleaks_8.30.1_checksums.txt de la release officielle, relevée le 7 novembre 2026.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      # Actions épinglées par commit ; licence MIT vérifiée le 7 novembre 2026.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier les types et construire le site
        run: npm run build
