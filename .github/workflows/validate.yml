name: Validation du référentiel

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        # bash explicite : active pipefail, pour que l'échec de coverage.py ne soit pas masqué par tee.
        shell: bash
    steps:
      # Actions épinglées par commit ; licence MIT vérifiée le 7 novembre 2026.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Contrôler le référentiel
        run: python scripts/validate.py
      - name: Comptes et couverture
        run: python scripts/coverage.py | tee -a "$GITHUB_STEP_SUMMARY"
