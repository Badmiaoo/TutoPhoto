name: Publication sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # relance à la main ; ne publie que main

permissions:
  contents: read

# Une seule publication à la fois ; une publication en cours n'est pas interrompue. Un groupe par référence : un
# lancement à la main sur une autre branche, dont le job est sauté, ne peut plus annuler une publication de main en
# attente dans le même groupe. Sources : docs/outillage.md, « Publication ».
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Sur main seulement (constat LIC-07 de l'audit, version 0.3.85) : lancé à la main sur une autre branche ou un tag,
    # le workflow publierait cette version du site ; deploy, qui attend build, est sauté avec lui. Sources et limites :
    # docs/outillage.md, « Publication ».
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      # Actions épinglées par commit ; licence MIT vérifiée le 7 novembre 2026.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Construire le site
        run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Droits nécessaires à la publication, d'après le README de actions/deploy-pages ; limités à ce job.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
