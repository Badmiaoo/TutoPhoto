name: Tags de version

on:
  push:
    branches: [main]
  workflow_dispatch: # relance à la main, par exemple après un échec ; le job ne tourne que sur main

# Seul ce workflow écrit dans le dépôt : il crée des tags et des releases, rien d'autre.
permissions:
  contents: write

# Un groupe par référence : un lancement à la main sur une autre branche, dont le job est sauté, ne peut plus annuler
# une exécution de main en attente dans le même groupe. Sources : docs/outillage.md, « Publication ».
concurrency:
  group: tags-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    # Sur main seulement (constat LIC-07 de l'audit, version 0.3.85) : lancé à la main sur une autre branche, le job
    # poserait des tags et des releases sur des commits de cette branche, que ce workflow ne déplace jamais ensuite.
    # Sources et limites : docs/outillage.md, « Publication ».
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      # Actions épinglées par commit ; licence MIT vérifiée le 7 novembre 2026.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tout l'historique, pour retrouver le commit de chaque version
          persist-credentials: false # git ne pousse rien : les tags passent par l'API
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Poser les tags et les releases des versions du changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/changelog.py tag --github
