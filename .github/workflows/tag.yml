name: Tags de version

on:
  push:
    branches: [main]
  workflow_dispatch: # relance à la main, par exemple après un échec

# Seul ce workflow écrit dans le dépôt : il crée des tags et des releases, rien d'autre.
permissions:
  contents: write

concurrency:
  group: tags
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      # Actions épinglées par commit ; licence MIT vérifiée le 7 novembre 2026.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tout l'historique, pour retrouver le commit de chaque version
          persist-credentials: false # git ne pousse rien : les tags passent par l'API
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Poser les tags et les releases des versions du changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/changelog.py tag --github
